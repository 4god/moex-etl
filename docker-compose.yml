x-airflow-common:
  &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Иначе в UI бывает Invalid URL 'http://:8793/log/...' (нет hostname для served logs)
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    # --- Connections (Admin → Connections; conn id = суффикс после AIRFLOW_CONN_)
    AIRFLOW_CONN_DWH: postgresql://etl:etl@postgres:5432/workshop
    AIRFLOW_CONN_SOURCEDB: postgresql://sourcedb_loader:sourcedb_loader@postgres:5432/sourcedb
    # HttpOperator (deferrable): host с «://» — полный base URL (см. HttpHook.get_conn).
    AIRFLOW_CONN_HTTP_OPEN_METEO: '{"conn_type":"http","host":"https://api.open-meteo.com"}'
    # Опционально: суперпользователь кластера (psql / отладка; не использовать в прод DAG).
    AIRFLOW_CONN_POSTGRES_BROWSE: postgresql://postgres:postgres@postgres:5432/postgres
    # --- Variables (Admin → Variables; имя = суффикс после AIRFLOW_VAR_)
    AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    AIRFLOW_VAR_OPEN_DATA_CONFIG_DIR: /opt/airflow/config
    AIRFLOW_VAR_WORKSHOP_ENV: local
    AIRFLOW_VAR_KAFKA_CONNECT_URL: http://kafka-connect:8083
    AIRFLOW_VAR_KAFKA_UI_URL_INTERNAL: http://kafka-ui:8080
    AIRFLOW_VAR_KAFKA_UI_URL_HOST: http://localhost:8090
    AIRFLOW_VAR_DBT_PROJECT_DIR: /opt/airflow/dbt
    # Kafka bootstrap для кода через os.getenv (см. pipeline_utils); значение совпадает с Variable kafka_bootstrap_servers.
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: workshop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: workshop-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "workshop-connect-cluster"
      CONFIG_STORAGE_TOPIC: workshop_connect_configs
      OFFSET_STORAGE_TOPIC: workshop_connect_offsets
      STATUS_STORAGE_TOPIC: workshop_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-plugins
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./debezium/connectors:/debezium/connectors

  # Веб-UI: топики, сообщения, consumer groups; опционально Kafka Connect (Debezium).
  # Локально: http://localhost:8090 — не выставляйте в интернет без аутентификации.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: workshop-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: workshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  postgres:
    image: postgres:16
    container_name: workshop-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      # Debezium (pgoutput): логическая репликация, несколько слотов на кластер.
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=16
      - -c
      - max_replication_slots=16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/bootstrap:/docker-entrypoint-initdb.d

  # Повторно применяет все sql/bootstrap/*.sql к живому Postgres (идемпотентно).
  # Так новые скрипты подхватываются без ручного psql; initdb.d по-прежнему отрабатывает при первом создании тома.
  bootstrap-apply:
    image: postgres:16
    container_name: workshop-bootstrap-apply
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_bootstrap.sh:/scripts/apply_bootstrap.sh:ro
      - ./sql/bootstrap:/bootstrap:ro
    entrypoint: ["/bin/bash", "/scripts/apply_bootstrap.sh"]

  airflow-init:
    <<: *airflow-common
    container_name: workshop-airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    # migrate всегда; create падает если admin уже есть — тогда webserver не стартует без "|| true"
    command: -c "airflow db migrate && (airflow users create --username admin --firstname Data --lastname Engineer --role Admin --email admin@example.com --password admin || true)"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bootstrap-apply:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: workshop-airflow-webserver
    hostname: workshop-airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: workshop-airflow-scheduler
    hostname: workshop-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Нужен для deferrable-операторов (HttpOperator deferrable, сенсоры async и т.д.).
  airflow-triggerer:
    <<: *airflow-common
    container_name: workshop-airflow-triggerer
    hostname: workshop-airflow-triggerer
    command: triggerer
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:latest
    container_name: workshop-metabase
    profiles: ["bi"]
    ports:
      # Host 8085 — внутри контейнера Metabase слушает 3000
      - "8085:3000"
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-apply:
        condition: service_completed_successfully

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: workshop-dbt
    profiles: ["dbt"]
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-apply:
        condition: service_completed_successfully

  dbt-docs:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: workshop-dbt-docs
    working_dir: /usr/app
    command: >
      sh -c "dbt docs generate --project-dir /usr/app --profiles-dir /usr/app --target dev &&
             dbt docs serve --host 0.0.0.0 --port 8081 --project-dir /usr/app --profiles-dir /usr/app --target dev"
    ports:
      - "8081:8081"
    volumes:
      - ./dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-apply:
        condition: service_completed_successfully

# Явное имя сети: меньше «битых» id при Recreate/параллельном старте (см. CI / --profile bi).
# COMPOSE_PROJECT_NAME задаётся в CI (уникально на run); локально — имя каталога по умолчанию.
networks:
  default:
    name: workshop_${COMPOSE_PROJECT_NAME:-etl_demo}
    driver: bridge

volumes:
  postgres-data:
  kafka-data:

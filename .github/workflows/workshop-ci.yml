# Два типа задач в одном workflow (иначе между двумя workflow нельзя выразить «деплой ждёт окончания reset»):
# 1) Stack reset smoke — только если изменились «тяжёлые» пути; новый push отменяет предыдущий smoke (concurrency на job).
# 2) Deploy на VM — на каждый push в workshop/moex-etl; ждёт завершения smoke, если тот запускался (успех или неуспех); новый деплой отменяет предыдущий деплой, но не трогает текущий smoke.
#
# Секреты/переменные для deploy: VM_HOST, VM_USER, VM_SSH_KEY, VM_DEPLOY_PATH (см. README).

name: Workshop CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "sql/bootstrap/**"
      - "scripts/**"
      - "airflow/**"
      - ".github/workflows/workshop-ci.yml"
  push:
    branches: [main, master, workshop/moex-etl]
    paths:
      - "docker-compose.yml"
      - "sql/bootstrap/**"
      - "scripts/**"
      - "airflow/**"
      - ".github/workflows/workshop-ci.yml"

jobs:
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            smoke:
              - 'docker-compose.yml'
              - 'sql/bootstrap/**'
              - 'scripts/**'
              - 'airflow/**'
              - '.github/workflows/workshop-ci.yml'

  reset-and-up:
    needs: paths-filter
    if: needs.paths-filter.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: stack-reset-smoke-${{ github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: smoke${{ github.run_id }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Down volumes and prune networks
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker network prune -f

      - name: Up (bootstrap-apply + Airflow)
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          set -euo pipefail
          wait_kafka_postgres() {
            docker compose up -d kafka postgres
            for i in $(seq 1 50); do
              k=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' workshop-kafka 2>/dev/null || echo missing)
              p=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' workshop-postgres 2>/dev/null || echo missing)
              if [[ "$k" == "healthy" && "$p" == "healthy" ]]; then
                return 0
              fi
              if [[ "$i" -eq 50 ]]; then
                echo "Timeout waiting for kafka/postgres healthy (last: kafka=$k postgres=$p)"
                docker compose ps -a
                return 1
              fi
              sleep 2
            done
          }
          compose_up_serial() {
            wait_kafka_postgres
            local svc
            for svc in kafka-connect kafka-ui bootstrap-apply airflow-init \
                       workshop-provision-airflow \
                       airflow-webserver airflow-scheduler airflow-triggerer dbt-docs; do
              echo "=== docker compose up -d --build $svc ==="
              docker compose up -d --build --remove-orphans "$svc"
              sleep 2
            done
          }
          for attempt in 1 2 3; do
            if compose_up_serial; then
              exit 0
            fi
            echo "compose up failed (attempt ${attempt}/3), pruning networks and retrying..."
            docker compose down --remove-orphans || true
            docker network prune -f
            sleep 5
          done
          exit 1

      - name: Wait for bootstrap-apply
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(docker inspect --format='{{.State.Status}}' workshop-bootstrap-apply 2>/dev/null || echo pending)
            if [[ "$status" == "exited" ]]; then
              code=$(docker inspect --format='{{.State.ExitCode}}' workshop-bootstrap-apply)
              echo "bootstrap-apply exit code: $code"
              echo "----- docker logs workshop-bootstrap-apply -----"
              docker logs workshop-bootstrap-apply 2>&1
              test "$code" = "0"
              exit 0
            fi
            sleep 2
          done
          echo "bootstrap-apply: timeout waiting for exit"
          echo "----- docker logs workshop-bootstrap-apply -----"
          docker logs workshop-bootstrap-apply 2>&1 || true
          exit 1

      - name: Wait for Airflow webserver
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health >/dev/null 2>&1; then
              echo "Airflow health OK"
              exit 0
            fi
            sleep 3
          done
          docker compose logs airflow-webserver --tail 80
          exit 1

      # Всё из stdout/stderr попадает в лог вкладки job в Actions. Шаг только при failure()
      # (если упал Up — следующие шаги без if: пропускаются, но этот выполнится).
      - name: Logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps -a ==="
          docker compose ps -a || true
          echo "=== workshop-bootstrap-apply (полный лог; контейнер короткоживущий) ==="
          docker logs workshop-bootstrap-apply 2>&1 || true
          echo "=== workshop-postgres (tail) ==="
          docker logs workshop-postgres 2>&1 | tail -n 150 || true
          echo "=== workshop-airflow-init (tail) ==="
          docker logs workshop-airflow-init 2>&1 | tail -n 150 || true
          echo "=== docker compose logs (все сервисы, tail) ==="
          docker compose logs --tail 200 2>&1 || true

  deploy-vm:
    needs: [paths-filter, reset-and-up]
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/workshop/moex-etl' &&
      (needs.reset-and-up.result == 'skipped' || needs.reset-and-up.result == 'success' || needs.reset-and-up.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-workshop-vm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: SSH — git pull и docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ vars.VM_DEPLOY_PATH }}"
            git fetch origin
            git checkout workshop/moex-etl
            git pull --ff-only origin workshop/moex-etl
            VM_INSTALL_NONINTERACTIVE=1 bash scripts/vm_install_host_tools.sh
            docker compose build
            docker compose --profile bi up -d
            docker compose exec -T airflow-scheduler airflow dags reserialize || true

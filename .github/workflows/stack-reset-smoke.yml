# Полный сброс томов и подъём стека в CI — проверка, что bootstrap и Airflow стартуют без ручных шагов.
name: Stack reset smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "sql/bootstrap/**"
      - "scripts/**"
      - "airflow/**"
  push:
    branches: [main, master, workshop/moex-etl]
    paths:
      - "docker-compose.yml"
      - "sql/bootstrap/**"
      - "scripts/**"
      - "airflow/**"

concurrency:
  group: stack-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset-and-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Полный down + prune сетей: иначе на runner иногда «network … not found» при следующем up.
      - name: Down volumes and prune networks
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker network prune -f

      # Двухфазный up: сначала kafka+postgres и ожидание healthy — иначе на GHA часто
      # «network … not found» при параллельном подключении десятка контейнеров к одной сети.
      # COMPOSE_PARALLEL_LIMIT=1 — по одному контейнеру на шаг во второй фазе.
      - name: Up (bootstrap-apply + Airflow)
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          set -euo pipefail
          compose_up_staged() {
            docker compose up -d kafka postgres
            for i in $(seq 1 50); do
              k=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' workshop-kafka 2>/dev/null || echo missing)
              p=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' workshop-postgres 2>/dev/null || echo missing)
              if [[ "$k" == "healthy" && "$p" == "healthy" ]]; then
                break
              fi
              if [[ "$i" -eq 50 ]]; then
                echo "Timeout waiting for kafka/postgres healthy (last: kafka=$k postgres=$p)"
                docker compose ps -a
                return 1
              fi
              sleep 2
            done
            docker compose up -d --build --remove-orphans
          }
          for attempt in 1 2 3; do
            if compose_up_staged; then
              exit 0
            fi
            echo "compose up failed (attempt ${attempt}/3), pruning networks and retrying..."
            docker compose down --remove-orphans || true
            docker network prune -f
            sleep 5
          done
          exit 1

      - name: Wait for bootstrap-apply
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(docker inspect --format='{{.State.Status}}' workshop-bootstrap-apply 2>/dev/null || echo pending)
            if [[ "$status" == "exited" ]]; then
              code=$(docker inspect --format='{{.State.ExitCode}}' workshop-bootstrap-apply)
              echo "bootstrap-apply exit code: $code"
              docker logs workshop-bootstrap-apply 2>&1 | tail -n 80
              test "$code" = "0"
              exit 0
            fi
            sleep 2
          done
          docker logs workshop-bootstrap-apply 2>&1 || true
          exit 1

      - name: Wait for Airflow webserver
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health >/dev/null 2>&1; then
              echo "Airflow health OK"
              exit 0
            fi
            sleep 3
          done
          docker compose logs airflow-webserver --tail 80
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120

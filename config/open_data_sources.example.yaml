# Скопируйте в open_data_sources.yaml при необходимости переопределений.
# Локальный open_data_sources.yaml в .gitignore.

# Опциональные секреты для API (профили называются вручную в sources).
credentials: {}

sources:
  # Макропоказатель: ВВП (текущий US$) — World Bank Open Data (публичный REST).
  national_accounts_gdp:
    kind: rest_json
    base_url: "https://api.worldbank.org/v2/country/{country}/indicator/{indicator}"
    query_params:
      format: json
      date: "2010:2020"
      per_page: 100
    path_params:
      country: RU
      indicator: NY.GDP.MKTP.CD

  # Справочник по странам — REST Countries (публичный REST).
  territory_catalog:
    kind: rest_json
    url: "https://restcountries.com/v3.1/independent"
    query_params:
      status: "true"
      fields: "name,capital,population,region"

  # ООН — справочник локаций (UN Population Data Portal API, JSON).
  un_population_locations:
    kind: rest_json
    url: "https://population.un.org/dataportalapi/api/v1/locations"
    query_params:
      pageSize: 100

  # Eurostat — пример набора в формате JSON (официальная статистика ЕС).
  eurostat_sdg_sample:
    kind: rest_json
    url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_08_10"
    query_params:
      format: JSON
      lang: en

  # NASA — Astronomy Picture of the Day (публичный REST; при лимитах замените DEMO_KEY).
  nasa_apod:
    kind: rest_json
    url: "https://api.nasa.gov/planetary/apod"
    query_params:
      api_key: "DEMO_KEY"

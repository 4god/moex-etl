version: 2

models:
  - name: fct_moex_liquidity
    description: "Ликвидность MOEX; читает ref(stg_dm_security_snapshot) ← datamart после DAG vault/marts."
    columns:
      - name: trade_date
        tests:
          - not_null
      - name: secid
        tests:
          - not_null
      - name: value_total
        tests:
          - not_null
      - name: num_trades
        tests:
          - not_null

  - name: fct_moex_movers
    description: "Витрина по изменению цены (дневной % change)."
    columns:
      - name: trade_date
        tests:
          - not_null
      - name: secid
        tests:
          - not_null
      - name: pct_change
        tests:
          - not_null

  - name: fct_cbr_fx_rates
    description: "Курсы ЦБ; ref(stg_cbr_fx_rates) ← STG после src_cbr_ingestion."
    columns:
      - name: rate_date
        tests:
          - not_null
      - name: char_code
        tests:
          - not_null

  - name: fct_moscow_weather_daily
    description: "Погода; ref(stg_moscow_weather_daily) ← STG после src_meteo_ingestion."
    columns:
      - name: weather_date
        tests:
          - not_null
      - name: weather_regime
        tests:
          - not_null

  - name: fct_moex_weather_snapshot
    description: "MOEX (datamart) + режим погоды (analytics): ref(stg_dm_security_snapshot) ⋈ ref(stg_dim_moscow_weather_regime)."
    columns:
      - name: trade_date
        tests:
          - not_null
      - name: secid
        tests:
          - not_null
